deploy_to_development:
  tags:
    - shell
  stage: deploy
  environment:
    name: development
    url: https://tlip-dev.run-odoo.com
  before_script:
    - git config --global --add safe.directory /opt/odoo/addons
  script:
    - ./deploy_dev.sh development
  only:
    - development

