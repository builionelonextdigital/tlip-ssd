services:
  odoo:
    tty: true
    ports:
      - "8888:3001"
      - "8069:8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
    entrypoint: ["/usr/bin/python3", "-m", "debugpy", "--listen", "0.0.0.0:3001", "/usr/bin/odoo", "--db_user=odoo", "--db_host=db", "--db_password=odoo", "-c", "/etc/odoo/odoo.conf"]
    # "-u", "dorcel_platform_connector_magento", "--test-enable", '--test-tags', "/dorcel_platform_connector_magento"
  db:
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "9001:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin

volumes:
  odoo-web-data:
  odoo-db-data:
